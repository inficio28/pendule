<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Jeu de mots à deviner</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main id="app">
    <section id="home" class="screen active">
      <h1>Bienvenue</h1>
      <p>Prêt à deviner des mots ?</p>
      <button id="startBtn" class="btn">Démarrer</button>
    </section>

    <section id="game" class="screen">
      <div class="top-row">
        <div class="status">
          <div><strong>Mot</strong></div>
          <div id="wordDisplay" class="word"></div>
        </div>
        <div class="info">
          <div><strong>Essais restants</strong></div>
          <div id="tries">0</div>
        </div>
      </div>

      <div class="controls">
        <label for="letterInput">Proposer une lettre</label>
        <input id="letterInput" maxlength="1" autocomplete="off" />
        <button id="guessBtn" class="btn">Proposer</button>
        <button id="giveUpBtn" class="btn alt">Abandonner</button>
      </div>

      <div class="guessed">
        <div><strong>Lettres proposées</strong></div>
        <div id="guessedLetters">-</div>
      </div>

      <div id="message" class="message"></div>

      <div class="footer">
        <button id="restartBtn" class="btn">Recommencer</button>
        <div class="hint"><strong>Astuce</strong> : vous pouvez aussi taper une lettre et appuyer sur Entrée.</div>
      </div>
    </section>
  </main>

  <script src="words.js"></script>
  <script src="script.js"></script>
</body>
</html>
